<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roro Jonggrang — WA Gateway</title>
    <link rel="icon" href="/assets/logo.png" />
    <link rel="stylesheet" href="/assets/style.css?v=3" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <img src="/assets/logo.png" alt="Roro Jonggrang" />
          <span>Roro <em>Jonggrang</em></span>
        </div>

        <nav class="menu" id="menu">
          <a href="/" data-route="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12L12 4l9 8"/><path d="M5 10v10h14V10"/></svg>
            <span>Ringkasan</span>
          </a>
          <a href="/send" data-route="send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12l16-8-6 18-3-8-7-2z"/></svg>
            <span>Kirim Pesan</span>
          </a>
          <a href="/history" data-route="history">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg>
            <span>Riwayat Terkirim</span>
          </a>
          <a href="/contacts" data-route="contacts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><circle cx="12" cy="8" r="4"/></svg>
            <span>Validasi Nomor</span>
          </a>
          <a href="/webhook" data-route="webhook">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 14l-4 4M14 14l4 4M12 2a4 4 0 0 0-4 4v6a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"/></svg>
            <span>Webhook</span>
          </a>
          <a href="/api" data-route="api">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3H4v18h16V3h-4M9 3h6v4H9z"/></svg>
            <span>Dokumentasi API</span>
          </a>
        </nav>

        <div class="user-card" id="userCard" style="display:none">
          <img id="userAvatar" class="avatar" src="" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;display:none">
          <div class="avatar" id="userInitials">—</div>
          <div class="user-info">
            <strong id="userName">—</strong>
            <span class="tag" id="botTag">idle</span>
          </div>
          <button type="button" class="icon-btn" title="Logout" id="btnLogout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </aside>

      <div class="main">
        <header class="page-header">
          <div class="titles">
            <h1 id="pageTitle">Ringkasan</h1>
            <p id="pageSubtitle">Status koneksi WhatsApp gateway</p>
          </div>
          <div class="page-actions">
            <div class="pill" id="statePill">
              <span class="dot"></span>
              <span id="stateLabel">memuat...</span>
            </div>
            <button type="button" class="icon-btn" title="Salin URL publik" id="btnCopyUrl">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
            <button type="button" class="icon-btn" title="Bantuan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .8-1 1.7"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>
            </button>
          </div>
        </header>

        <div class="content" id="content">
          <!-- pages injected here -->
        </div>
      </div>
    </div>

    <div class="toast-host" id="toasts"></div>

    <template id="tpl-overview">
      <section class="grid four">
        <article class="metric primary">
          <span class="label">Status Bot</span>
          <strong id="statBotState">—</strong>
          <span class="muted" id="statBotReady">ready: —</span>
        </article>
        <article class="metric">
          <span class="label">Nomor Terhubung</span>
          <strong id="statBotPhone">—</strong>
          <span class="muted" id="statBotMatch">—</span>
        </article>
        <article class="metric">
          <span class="label">Uptime</span>
          <strong id="statUptime">—</strong>
          <span class="muted" id="statUpdated">—</span>
        </article>
        <article class="metric">
          <span class="label">Webhook</span>
          <strong id="statWebhook">—</strong>
          <span class="muted" id="statWebhookMode">—</span>
        </article>
      </section>

      <section class="card qr-card hidden" id="qrCard">
        <div>
          <h2 id="waCardTitle">Perlu Scan QR</h2>
          <p class="muted" id="waCardHint">Buka WhatsApp → <b>Setelan</b> → <b>Perangkat tertaut</b> → <b>Tautkan perangkat</b>. QR di-refresh otomatis.</p>
        </div>
        <div id="qrHost"></div>
        <div class="row" style="gap:8px;margin-top:12px" id="waActions">
          <button type="button" class="btn danger" id="btnDisconnect">Putuskan Koneksi</button>
          <button type="button" class="btn primary hidden" id="btnReconnect">Sambungkan Ulang</button>
        </div>
      </section>

      <section class="grid four">
        <article class="metric">
          <span class="label">Pesan Hari Ini</span>
          <strong id="statTodayTotal">0</strong>
          <span class="muted" id="statTodayTime">—</span>
        </article>
        <article class="metric">
          <span class="label">Berhasil</span>
          <strong id="statTodaySuccess" style="color:var(--ok)">0</strong>
          <span class="muted" id="statSuccessRate">—</span>
        </article>
        <article class="metric">
          <span class="label">Gagal</span>
          <strong id="statTodayFailed" style="color:var(--danger)">0</strong>
          <span class="muted" id="statFailedRate">—</span>
        </article>
        <article class="metric">
          <span class="label">Total Pesan</span>
          <strong id="statAllTime">0</strong>
          <span class="muted" id="statAllTimeLabel">semua waktu</span>
        </article>
      </section>

      <section class="grid two">
        <article class="card">
          <div class="card-head">
            <h2>Grafik Pengiriman</h2>
            <span class="muted">7 hari terakhir</span>
          </div>
          <div style="height:220px;position:relative">
            <canvas id="chartSendVolume"></canvas>
          </div>
        </article>

        <article class="card">
          <div class="card-head">
            <h2>Aktivitas Terbaru</h2>
            <a href="/history" class="link" data-route="history">Lihat semua</a>
          </div>
          <div class="mini-list" id="miniHistory">
            <p class="muted empty">Belum ada pesan yang dikirim.</p>
          </div>
        </article>
      </section>
    </template>

    <template id="tpl-send">
      <section class="grid two">
        <article class="card">
          <h2>Kirim Pesan Baru</h2>
          <p class="muted">Pesan dikirim melalui nomor WhatsApp yang terhubung. Pastikan status <b>ready</b>.</p>
          <form id="sendForm" class="form">
            <label>Nomor tujuan
              <input name="phone" placeholder="0812xxxxxxxx atau 62812xxxxxxxx" required />
            </label>
            <label>Pesan
              <textarea name="message" rows="6" placeholder="Tulis pesan Anda di sini..." required></textarea>
            </label>
            <div class="row space-between">
              <button type="button" class="btn ghost" id="btnQuickTest">Kirim ke nomor sendiri</button>
              <button type="submit" class="btn primary">Kirim Pesan</button>
            </div>
          </form>
        </article>

        <article class="card">
          <h2>Indikator Mengetik</h2>
          <p class="muted">Tampilkan indikator "sedang mengetik" di WhatsApp penerima.</p>
          <form id="typingForm" class="form">
            <label>Nomor tujuan
              <input name="phone" placeholder="0812xxxxxxxx" required />
            </label>
            <div class="row">
              <button type="button" class="btn" data-state="true">Mulai Mengetik</button>
              <button type="button" class="btn ghost" data-state="false">Berhenti</button>
            </div>
          </form>
        </article>
      </section>
    </template>

    <template id="tpl-history">
      <section class="card">
        <div class="card-head">
          <h2>Riwayat Pesan Terkirim</h2>
          <div class="row">
            <select id="historyFilter" class="select">
              <option value="all">Semua status</option>
              <option value="success">Berhasil</option>
              <option value="failed">Gagal</option>
            </select>
          </div>
        </div>
        <table class="table" id="historyTable">
          <thead><tr><th>Waktu</th><th>Nomor</th><th>Pesan</th><th>Status</th></tr></thead>
          <tbody><tr><td colspan="4" class="muted center">Belum ada data.</td></tr></tbody>
        </table>
      </section>
    </template>

    <template id="tpl-contacts">
      <section class="card">
        <h2>Cek Nomor WhatsApp</h2>
        <p class="muted">Verifikasi apakah nomor terdaftar aktif di WhatsApp.</p>
        <form id="validateForm" class="form">
          <div class="grid two" style="gap:12px;align-items:end">
            <label>Nomor
              <input name="phone" placeholder="0812xxxxxxxx" required />
            </label>
            <button type="submit" class="btn primary" style="height:42px">Validasi</button>
          </div>
        </form>
        <div class="result" id="validateResult"></div>
      </section>
    </template>

    <template id="tpl-webhook">
      <section class="card">
        <div class="card-head">
          <h2>Konfigurasi Webhook</h2>
          <span class="muted">Tersimpan per-tenant · aktif tanpa restart</span>
        </div>
        <form id="webhookForm" class="form">
          <label class="field">
            <span class="field-label">URL Webhook ERP</span>
            <input name="url" type="url" placeholder="https://erpanda.com/wa/incoming" />
            <span class="muted">Endpoint di aplikasi ERP untuk menerima pesan masuk. Kosongkan untuk menonaktifkan.</span>
          </label>

          <label class="field">
            <span class="field-label">Metode Autentikasi</span>
            <select name="authMode" id="authModeSelect">
              <option value="none">Tanpa autentikasi</option>
              <option value="hmac">HMAC Signature (x-wa-signature)</option>
              <option value="bearer">Bearer Token (Authorization header)</option>
            </select>
            <span class="muted" id="authModeHint">Pilih metode verifikasi yang didukung endpoint ERP Anda.</span>
          </label>

          <label class="field" id="secretField">
            <span class="field-label">Secret (HMAC Signature)</span>
            <div class="input-group">
              <input name="secret" type="password" placeholder="Kosongkan untuk tetap gunakan yang tersimpan" />
              <button type="button" class="btn ghost" id="btnGenSecret">Generate</button>
            </div>
            <span class="muted" id="secretHint">Minimal 16 karakter. Digunakan untuk verifikasi HMAC di sisi ERP.</span>
          </label>

          <label class="field" id="bearerField">
            <span class="field-label">Bearer Token</span>
            <div class="input-group">
              <input name="bearerToken" type="password" placeholder="Masukkan token autentikasi" autocomplete="off" />
              <button type="button" class="btn ghost" id="btnToggleBearer" aria-label="Tampilkan Bearer Token">Tampilkan</button>
            </div>
            <span class="muted" id="bearerHint">Token akan dikirim di header <code>Authorization: Bearer &lt;token&gt;</code>.</span>
          </label>

          <div class="field-grid">
            <label class="field">
              <span class="field-label">Timeout (ms)</span>
              <input name="timeoutMs" type="number" min="1000" max="60000" placeholder="8000" />
              <span class="muted">1000–60000 ms. Default: 8000 ms.</span>
            </label>
            <label class="toggle-card">
              <input name="ignoreGroups" type="checkbox" />
              <span class="toggle-body">
                <span class="toggle-title">Abaikan Pesan Grup</span>
                <span class="toggle-hint">Jangan teruskan pesan dari WhatsApp Group ke webhook.</span>
              </span>
            </label>
          </div>

          <label class="field">
            <span class="field-label">Whitelist Nomor Pengirim</span>
            <textarea name="allowedSenders" rows="3" placeholder="Contoh: 6281234567890&#10;Satu nomor per baris"></textarea>
            <span class="muted">Pisahkan dengan koma atau baris baru. Kosongkan untuk menerima semua nomor.</span>
          </label>

          <div class="form-actions">
            <div class="row" style="gap:6px">
              <button type="button" class="btn ghost" id="btnClearSecret">Hapus Secret</button>
              <button type="button" class="btn ghost" id="btnClearBearer">Hapus Token</button>
            </div>
            <button type="submit" class="btn primary">Simpan Perubahan</button>
          </div>
        </form>
      </section>

      <section class="grid two">
        <article class="card">
          <h2>Status Webhook</h2>
          <ul class="quick-list">
            <li><span>URL Aktif</span><code id="whUrl">—</code></li>
            <li><span>Auth Mode</span><code id="whAuthMode">—</code></li>
            <li><span>Secret HMAC</span><code id="whSecret">—</code></li>
            <li><span>Bearer Token</span><code id="whBearer">—</code></li>
            <li><span>Timeout</span><code id="whTimeout">—</code></li>
            <li><span>Grup</span><code id="whGroups">—</code></li>
            <li><span>Whitelist</span><code id="whAllowed">—</code></li>
          </ul>
        </article>
        <article class="card">
          <h2>Contoh Payload</h2>
          <pre class="code-block"><code>POST &lt;WEBHOOK_URL&gt;
Content-Type: application/json
User-Agent: rorojongrang-wa

{
  "messageId": "...",
  "from": "628xxx",
  "body": "pesan masuk",
  "timestamp": 1721001234,
  "isGroup": false,
  "type": "chat"
}</code></pre>
        </article>
      </section>
    </template>

    <template id="tpl-api">
      <section class="card">
        <h2>Endpoint API</h2>
        <p class="muted">Gunakan API key dari dashboard untuk autentikasi. Semua endpoint memerlukan header <code>x-api-key</code>.</p>
        <table class="table endpoints">
          <thead><tr><th>Metode</th><th>Endpoint</th><th>Deskripsi</th></tr></thead>
          <tbody>
            <tr><td><span class="method get">GET</span></td><td><code>/api/status</code></td><td>Status koneksi WhatsApp</td></tr>
            <tr><td><span class="method get">GET</span></td><td><code>/api/qr</code></td><td>QR code untuk autentikasi</td></tr>
            <tr><td><span class="method post">POST</span></td><td><code>/api/send</code></td><td><code>{ phone, message }</code> — kirim pesan</td></tr>
            <tr><td><span class="method post">POST</span></td><td><code>/api/validate-number</code></td><td><code>{ phone }</code> — cek nomor terdaftar WA</td></tr>
            <tr><td><span class="method post">POST</span></td><td><code>/api/typing</code></td><td><code>{ phone, state }</code> — indikator mengetik</td></tr>
          </tbody>
        </table>
      </section>
      <section class="card">
        <h2>Contoh Integrasi</h2>
        <pre class="code-block"><code>curl -X POST https://your-domain.com/api/send \
  -H "Content-Type: application/json" \
  -H "x-api-key: YOUR_API_KEY" \
  -d '{"phone":"08123456789","message":"Halo dari ERP"}'</code></pre>
      </section>
    </template>

    <script src="/assets/chart.umd.min.js"></script>
    <script src="/assets/app.js?v=4" type="module"></script>
  </body>
</html>
